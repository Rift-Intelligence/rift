<!doctype html><html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>RIFT — font options</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600&display=swap" rel="stylesheet"/>
<style>
  :root{--bg:#0f1011;--panel:#121315;--surface:#17181b;--surface-2:#1e1f23;
    --line:rgba(255,255,255,.06);--line-2:rgba(255,255,255,.10);
    --text:#ececed;--muted:#a0a1a6;--faint:#6b6c72;--accent:#2bccdf;--accent-ink:#04212a;
    --warn:#e8b339;--danger:#f06a6a;--mono:'JetBrains Mono',ui-monospace,monospace}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Geist',sans-serif;
    -webkit-font-smoothing:antialiased;letter-spacing:-.011em;padding:30px 32px 50px}
  h1{font-size:18px;font-weight:600;margin:0 0 4px}
  .sub{color:var(--faint);font-size:13px;margin:0 0 26px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .fc{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;font-family:var(--body)}
  .fc.best{border-color:rgba(43,204,223,.4)}
  .fch{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
  .fch .opt{font-family:var(--disp);font-weight:600;font-size:14px}
  .fch .nm{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint)}
  .fch .badge{font-size:11px;font-weight:600;color:var(--accent)}
  .fcb{padding:18px}
  .brand{display:flex;align-items:center;gap:9px;margin-bottom:16px}
  .brand .mark{width:23px;height:23px;border-radius:6px;background:var(--accent);color:var(--accent-ink);
    display:grid;place-items:center;font-weight:700;font-size:13px;font-family:var(--mono)}
  .brand b{font-family:var(--disp);font-weight:600;letter-spacing:.16em;font-size:14px}
  .hl{font-family:var(--disp);font-size:22px;font-weight:600;letter-spacing:-.02em;margin:0 0 12px}
  .au{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .au b{font-family:var(--disp);font-size:13px;font-weight:600}
  .au .meta{font-size:11px;color:var(--faint)}
  .msg{font-size:15px;line-height:1.7;color:#dcdde0;margin:0 0 14px}
  .msg b{color:#fff;font-weight:600}
  .msg code{font-family:var(--mono);font-size:12.5px;background:var(--surface);border:1px solid var(--line);padding:1px 6px;border-radius:5px;color:#cdced2}
  .term{font-family:var(--mono);font-size:12px;line-height:1.7;background:#0b0c0d;border:1px solid var(--line);
    border-radius:10px;padding:11px 13px;color:#a7a9af}
  .term .g{color:#5ec8d8}.term .m{color:var(--faint)}.term .w{color:var(--warn)}
  .row{display:flex;align-items:center;gap:8px;margin-top:14px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;padding:2px}
  .seg b{font-size:12px;font-weight:500;color:var(--muted);padding:5px 11px;border-radius:6px}
  .seg b.on{background:rgba(43,204,223,.12);color:var(--accent);display:inline-flex;align-items:center;gap:6px}
  .seg b.on .d{width:5px;height:5px;border-radius:50%;background:var(--accent)}
  .sel{font-family:var(--disp);font-size:12.5px;color:var(--text);font-weight:500;padding:6px 4px}
  .tok{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint)}
</style>
</head><body>
  <h1>RIFT — font options</h1>
  <p class="sub">Same screen slice in each option. Terminal stays JetBrains Mono in all four. Cyan accent unchanged.</p>
  <div class="grid">

    <div class="fc best" style="--disp:'Space Grotesk',sans-serif;--body:'Geist',sans-serif">
      <div class="fch"><span class="opt">B — Hybrid</span><span class="badge">recommended</span><span class="nm">Space Grotesk × Geist</span></div>
      <div class="fcb"></div>
    </div>

    <div class="fc" style="--disp:'Space Grotesk',sans-serif;--body:'Space Grotesk',sans-serif">
      <div class="fch"><span class="opt">A — Space Grotesk</span><span class="nm">all · geometric edge</span></div>
      <div class="fcb"></div>
    </div>

    <div class="fc" style="--disp:'Geist',sans-serif;--body:'Geist',sans-serif">
      <div class="fch"><span class="opt">C — Geist</span><span class="nm">all · clean technical</span></div>
      <div class="fcb"></div>
    </div>

    <div class="fc" style="--disp:'General Sans',sans-serif;--body:'General Sans',sans-serif">
      <div class="fch"><span class="opt">D — General Sans</span><span class="nm">all · premium warm</span></div>
      <div class="fcb"></div>
    </div>

  </div>
<script>
  var slice = `
    <div class="brand"><div class="mark">R</div><b>RIFT</b></div>
    <div class="hl">What are we breaking into today?</div>
    <div class="au"><b>RIFT</b><span class="meta">Strike · EXECUTOR</span></div>
    <p class="msg">Four live hosts. <code>vpn.acme.com</code> is on <b>OpenVPN 2.4.6</b> — outdated. Running a targeted nuclei pass on the web hosts now.</p>
    <div class="term"><span class="m">$ subfinder -d acme.com | httpx</span>
https://<span class="g">api.acme.com</span>   [200] [Express]
https://<span class="g">vpn.acme.com</span>   [<span class="w">OpenVPN 2.4.6</span>]
<span class="m">4 live hosts · 11 resolved</span></div>
    <div class="row">
      <div class="seg"><b>ASK</b><b class="on"><span class="d"></span>EXECUTOR</b></div>
      <span class="sel">Strike</span>
      <span class="tok">~3,200 tok</span>
    </div>`;
  document.querySelectorAll('.fcb').forEach(function(el){ el.innerHTML = slice; });
</script>
</body></html>
