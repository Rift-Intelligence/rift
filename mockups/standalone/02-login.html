  <style>
:root {
  --bg:#1e1e1e;--sidebar:#181818;--panel:#252526;--surface-hover:#2a2d2e;--surface-active:#37373d;
  --input-bg:#3c3c3c;--border:#3c3c3c;--border-subtle:#2b2b2b;
  --text:#cccccc;--text-bright:#e8e8e8;--muted:#858585;--faint:#6e6e6e;
  --accent:#0078d4;--success:#89d185;--warning:#cca700;--danger:#f48771;
  --composer-bg:#252526;--composer-border:#3c3c3c;--emerald:#34d399;
  --r:6px;--r-lg:8px;--sidebar-w:260px;--titlebar-h:35px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
* { box-sizing:border-box; }
html,body { margin:0; }
body { background:var(--bg); color:var(--text); font-family:var(--font); font-size:13px; line-height:1.5; -webkit-font-smoothing:antialiased; }
a,button { font:inherit; cursor:pointer; }
.landing-grid-bg { background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.035) 1px,transparent 0); background-size:28px 28px; min-height:100vh; }
.wordmark-lockup { display:inline-flex; flex-direction:column; align-items:center; }
.wordmark-tag { font-family:var(--mono); color:var(--muted); text-transform:lowercase; letter-spacing:0; }
.logo-row { display:flex; align-items:center; gap:8px; border:none; background:none; color:var(--text-bright); text-decoration:none; }
.mascot { width:33px; height:32px; position:relative; flex:none; animation:mascot-bob 1.8s ease-in-out infinite; transform-origin:center bottom; }
.mascot .p { position:absolute; background:#f5f5f2; }
.mascot .e { background:#161618; }
.mascot .n { background:#ebebe6; }
.mascot .leg-l { animation:leg-l .9s ease-in-out infinite; }
.mascot .leg-r { animation:leg-r .9s ease-in-out infinite; }
@keyframes mascot-bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-2px)} }
@keyframes leg-l { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-2px)} }
@keyframes leg-r { 0%,100%{transform:translateY(-2px)} 50%{transform:translateY(0)} }

.auth-shell { min-height:100vh; display:flex; flex-direction:column; }
.auth-header { position:sticky; top:0; z-index:10; border-bottom:1px solid rgba(60,60,60,.6); background:rgba(30,30,30,.8); backdrop-filter:blur(12px); }
.auth-header-inner { display:flex; align-items:center; justify-content:space-between; height:48px; max-width:72rem; margin:0 auto; padding:0 1rem; }
.auth-main { flex:1; display:flex; align-items:center; justify-content:center; padding:40px 16px; }
.auth-card { width:100%; max-width:400px; }
.mascot-auth { position:relative; margin-bottom:20px; display:flex; justify-content:center; }
.mascot-auth .glow { position:absolute; left:50%; top:50%; width:96px; height:96px; transform:translate(-50%,-50%); border-radius:50%; background:rgba(255,255,255,.1); filter:blur(32px); }
.mascot-auth .mascot { transform:scale(1.35); filter:drop-shadow(0 8px 32px rgba(255,255,255,.15)); }
.auth-card h1 { margin:0; text-align:center; font-size:1.75rem; font-weight:600; color:var(--text-bright); }
.auth-card .sub { margin:8px auto 0; max-width:18rem; text-align:center; font-size:14px; color:var(--muted); line-height:1.5; }
.form-panel { margin-top:24px; border:1px solid var(--border); border-radius:var(--r-lg); background:var(--panel); padding:20px 24px; }
.form-panel label { display:block; margin-top:16px; }
.form-panel label:first-child { margin-top:0; }
.form-panel label span { font-size:12px; font-weight:500; color:var(--muted); }
.form-panel input { margin-top:6px; width:100%; border:1px solid var(--border); border-radius:var(--r); background:var(--bg); padding:10px 12px; font-size:13px; color:var(--text-bright); outline:none; }
.form-panel input::placeholder { color:var(--faint); }
.form-panel input:focus { border-color:#505050; }
.btn-submit { margin-top:24px; width:100%; height:40px; border:none; border-radius:var(--r); background:var(--text-bright); color:var(--bg); font-size:13px; font-weight:500; display:flex; align-items:center; justify-content:center; gap:8px; }
.auth-footer { text-align:center; margin-top:24px; font-size:13px; color:var(--muted); }
.auth-footer a { color:var(--text-bright); text-decoration:underline; text-underline-offset:4px; }
.auth-note { text-align:center; margin-top:16px; font-size:11px; color:var(--faint); }
.auth-page-footer { border-top:1px solid rgba(60,60,60,.4); padding:24px; text-align:center; font-size:12px; color:var(--muted); }
.auth-page-footer a { color:var(--muted); margin:0 8px; }

  </style>
</head>
