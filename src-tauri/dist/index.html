<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RIFT</title>
    <style>
      html,body{height:100%;margin:0;background:#0a0a0a;color:#e8e8e8;
        font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
        display:flex;align-items:center;justify-content:center}
      .b{text-align:center;opacity:.85}
      .s{width:28px;height:28px;border:3px solid #333;border-top-color:#22d3ee;
        border-radius:50%;margin:0 auto 16px;animation:spin .8s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
    </style>
  </head>
  <body>
    <div class="b"><div class="s"></div>RIFT yükleniyor…</div>
  </body>
</html>
